<!-- ================= HEADER ================= -->
<section class="algo-header">

    <h1>Explore Cryptography Algorithms</h1>

    <p>
        Learn how different encryption algorithms work through explanations
        and interactive examples.
    </p>

</section>

<!-- ================= SELECTOR ================= -->
<section class="selector-section">

    <div class="selector-box">

        <label>Choose Algorithm</label>

        <div class="algorithm-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="algorithmSearch" placeholder="Search algorithms...">
        </div>

        <select id="algorithmSelector">
          <option value="caesar">Caesar Cipher</option>
          <option value="vigenere">Vigenere Cipher</option>
          <option value="rsa">RSA Cipher</option>
          <option value="hash">Hash Function</option>
          <option value="rotator">Rotor Cipher (Advanced)</option>
          <option value="rotatorbasic">Rotator Cipher (Basic)</option>
          <option value="substitution">Substitution Cipher</option>
          <option value="affine">Affine Cipher</option>
          <option value="aes">AES</option>
          <option value="railfence">Rail Fence Cipher</option>
          <option value="diffie">Diffie-Hellman</option>
          <option value="columnar">Columnar Transposition</option>
          <option value="hill">Hill Cipher</option>
          <!-- ==========================
          DES IMPLEMENTATION
          ========================== -->
          <option value="des">DES</option>
          <!-- ==========================
          TRIPLE DES IMPLEMENTATION
          ========================== -->
          <option value="tripledes">Triple DES (3DES)</option>
          <!-- ==========================
          ONE-TIME PAD (OTP) IMPLEMENTATION
          ========================== -->
          <option value="otp">One-Time Pad (OTP)</option>
        </select>

    </div>

</section>

<!-- ================= DYNAMIC CONTENT ================= -->
<section class="dynamic-section">

    <div class="dynamic-card">

        <div id="algorithmContent"></div>

    </div>

</section>
